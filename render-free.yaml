services:
  - type: web
    name: vitalis-api-free
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace @vitalis/api
    startCommand: npm run start --workspace @vitalis/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: DATABASE_PATH
        value: /tmp/vitalis.sqlite
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 120
